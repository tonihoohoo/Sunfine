[package]
name = "ultrafine-ctl"
version = "0.7.0"
edition = "2021"
rust-version = "1.90"
resolver = "3"
description = "Brightness hotkeys and automatic brightness for the LG UltraFine 5K"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "1"
directories = "6"
global-hotkey = "0.10"
tray-icon = "0.26"
tao = "0.37"
softbuffer = "0.4"
tiny-skia = "0.12"
fontdue = "0.9"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Threading",
] }
wmi = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = "2.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
